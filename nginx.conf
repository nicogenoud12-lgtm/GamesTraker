server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html y el service worker nunca se cachean, así una versión nueva llega enseguida.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API de sincronización (servicio "api" del docker-compose).
    # Con el resolver de Docker y la dirección en una variable, nginx vuelve a buscar la IP de "api":
    # si no, después de recrear ese contenedor (al actualizar) le seguía hablando a la vieja y daba 502.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8787;
        proxy_pass $api;
        proxy_set_header Host $host;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
