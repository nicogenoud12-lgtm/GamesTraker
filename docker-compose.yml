services:
  web:
    build:
      context: .
      args:
        # Se lee del archivo .env junto a este docker-compose.yml
        - VITE_RAWG_KEY=${VITE_RAWG_KEY:-}
        - VITE_TMDB_KEY=${VITE_TMDB_KEY:-}
    ports:
      - "3030:80"
    depends_on:
      - api
    restart: unless-stopped

  # Cuentas (usuario y contraseña) y los datos de cada una para sincronizar.
  api:
    build: ./server
    environment:
      # Con "true" se pueden crear más cuentas además de la primera.
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}
      # Nota de críticos de IGDB para los juegos sin Metacritic (app de https://dev.twitch.tv/console).
      # La misma key de RAWG del build: arma el índice de juegos populares (búsqueda al instante).
      - RAWG_KEY=${VITE_RAWG_KEY:-}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID:-}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET:-}
      # Trakt, para saber qué terminaste de ver en Nuvio (app de https://trakt.tv/oauth/applications).
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      # Solo si tu app de Trakt tiene secret (las nuevas no lo traen).
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
    volumes:
      - gamestraker_data:/data
    restart: unless-stopped

volumes:
  gamestraker_data:
