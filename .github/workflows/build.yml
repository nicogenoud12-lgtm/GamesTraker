name: Build

# Arma las mismas imágenes de Docker que usa el servidor (app y API de
# sincronización), para saber antes de mergear que el PR compila.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar las imágenes del servidor
        run: docker compose build
      - name: Probar la API de sincronización
        run: |
          docker run -d --name api -p 8787:8787 gamestraker-api
          for i in $(seq 1 20); do curl -sf localhost:8787/api/health && break; sleep 1; done
          TOKEN=$(curl -sf -H 'Content-Type: application/json' \
            -d '{"username":"ci-test","password":"clave-de-prueba"}' localhost:8787/api/auth/register | jq -r .token)
          curl -sf -H "Authorization: Bearer $TOKEN" -X PUT \
            -d '{"baseVersion":0,"data":{"games":{},"ratings":{},"lists":[]}}' localhost:8787/api/state
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8787/api/state | grep -q '"version":1'
          # Con una cuenta creada, el registro queda cerrado y una sesión falsa no entra.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"username":"otro","password":"clave-de-prueba"}' localhost:8787/api/auth/register)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer x.y' localhost:8787/api/state)" = 401
          # IMDb responde aunque el archivo diario todavía se esté descargando (503).
          code=$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8787/api/imdb?id=tt0111161')
          test "$code" = 200 -o "$code" = 503
          # La nota de críticos pide sesión y el nombre del juego.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8787/api/critics?name=Hades')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'localhost:8787/api/critics')" = 400
          # El perfil público está apagado hasta que se activa, y nunca muestra las notas.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/api/public/ci-test)" = 404
          curl -sf -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"public":true}' \
            localhost:8787/api/profile | grep -q '"public":true'
          curl -sf localhost:8787/api/public/ci-test | grep -q '"username":"ci-test"'
          # Con el link de invitación se puede crear una cuenta aunque el registro esté cerrado, y quedan amigos.
          CODE=$(curl -sf -H "Authorization: Bearer $TOKEN" localhost:8787/api/friends | jq -r .code)
          AMIGO=$(curl -sf -H 'Content-Type: application/json' \
            -d "{\"username\":\"ci-amigo\",\"password\":\"clave-de-prueba\",\"invite\":\"$CODE\"}" localhost:8787/api/auth/register | jq -r .token)
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8787/api/friends | grep -q '"username":"ci-amigo"'
          curl -sf -H "Authorization: Bearer $AMIGO" 'localhost:8787/api/friends/ratings?id=rawg:1' | grep -q '"ratings"'
          curl -sf -H "Authorization: Bearer $AMIGO" localhost:8787/api/notifications | grep -q '"unread":0'
          curl -sf localhost:8787/api/push/key | grep -q '"key"'
          # Duración y Rotten Tomatoes: solo con sesión, y el id de IMDb se valida.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8787/api/length?name=Hades')" = 401
          # El índice de juegos populares es solo con sesión (sin key de RAWG en CI, todavía no existe).
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/api/games/index)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" localhost:8787/api/games/index)" = 404
          # Lo mejor del año desde IGDB: solo con sesión, valida el período y, sin IGDB, avisa (la app usa RAWG).
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8787/api/games/discover?from=2026-01-01&to=2026-12-31&order=best')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'localhost:8787/api/games/discover?from=2026-01-01&to=2026-12-31&order=best')" = 503
          # Sin IGDB configurado, las carátulas quedan las de RAWG (no devuelve ninguna).
          curl -sf -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"games":[{"id":"rawg:1","name":"Hades","year":2020}]}' localhost:8787/api/covers | grep -q '"covers":{}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'localhost:8787/api/rt?imdb=x')" = 400
          # Playnite: la extensión trae la clave de la cuenta; sin ella (o con otra) no entra.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/api/playnite)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Playnite-Key: 0123abcd.x' -H 'Content-Type: application/json' -d '{}' localhost:8787/api/playnite/report)" = 401
          PKEY=$(curl -sf -H "Authorization: Bearer $TOKEN" -X POST localhost:8787/api/playnite/connect | jq -r .key)
          curl -sf -H "Authorization: Bearer $TOKEN" 'localhost:8787/api/playnite/extension?origin=https://ejemplo.com' | head -c 2 | grep -q PK
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Playnite-Key: $PKEY" -H 'Content-Type: application/json' \
            -d '{"event":"started","games":[{"name":"Hades","playtime":60}]}' localhost:8787/api/playnite/report)" = 202
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8787/api/playnite | grep -q '"connected":true'
          # Sin claves de Trakt en el servidor, la conexión con Nuvio aparece como no configurada.
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8787/api/trakt | grep -q '"enabled":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -X POST localhost:8787/api/trakt/connect)" = 503
